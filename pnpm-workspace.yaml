minimumReleaseAgeExclude:
  - '@vue/language-core@3.3.11'
  - vue-tsc@3.3.11
  - markdown-exit@1.3.0

shellEmulator: true

trustPolicy: no-downgrade
# VitePress 1.x 依赖 vite ^5.4.14，5.4.21 由 provenance 发布，
# 与更早版本的 trusted publisher 证据不同，被信任策略判为降级。
trustPolicyExclude:
  - vite@5.4.21

packages:
  - packages/*
  - docs
  - e2e
  # Fixture sites for the plugin E2E specs.
  - e2e/fixtures/*
  - bench

overrides:
  '@xmldom/xmldom@0.9.10': 0.9.12

catalogs:
  bench:
    chrome-launcher: 1.2.2
    lighthouse: 12.8.2
    vitepress: 1.6.4
  dev:
    '@antfu/eslint-config': ^9.3.0
    '@types/node': ^26.2.0
    eslint: ^10.8.1
    happy-dom: ^20.11.6
    typescript: ^6.0.3
    vitest: ^4.1.11
    vue-tsc: ^3.3.11
  frontend:
    '@unhead/vue': ^3.3.2
    '@vue/server-renderer': ^3.5.41
    floating-vue: ^5.2.2
    minisearch: ^7.2.0
    overlayscrollbars: ^2.16.0
    vue: ^3.5.41
    vue-router: ^5.2.0
  markdown:
    '@mdit-vue/plugin-component': ^3.0.2
    '@mdit-vue/plugin-frontmatter': ^3.0.2
    '@mdit-vue/plugin-headers': ^3.0.2
    '@mdit-vue/plugin-sfc': ^3.0.2
    '@mdit/plugin-alert': 1.0.3
    '@mdit/plugin-attrs': 1.1.1
    '@mdit/plugin-container': ^1.0.2
    '@mdit/plugin-mathjax': 1.1.1
    '@shikijs/transformers': ^4.4.3
    '@shikijs/twoslash': ^4.4.3
    gray-matter: ^4.0.3
    markdown-exit: ^1.3.0
    markdown-it-anchor: ^9.2.0
    mdast-util-from-markdown: ^2.0.3
    mdast-util-gfm: ^3.1.0
    mdast-util-to-hast: ^13.2.1
    node-html-markdown: ^2.0.0
    node-html-parser: ^6.1.13
    shiki: ^4.4.3
    twoslash-vue: ^0.3.9
  node:
    '@clack/prompts': ^1.8.1
    '@vitejs/plugin-vue': ^6.0.8
    citty: ^0.2.2
    consola: ^3.4.2
    jiti: ^2.7.0
    sirv: ^3.0.2
    sitemap: ^9.0.1
    tinyglobby: ^0.2.17
    unocss: ^66.8.1
    vite: ^8.2.2
  test:
    '@playwright/test': ^1.63.0
    playwright: ^1.63.0

# VitePress 通过 vite 5 拉入 esbuild，其安装脚本只做二进制自检。
allowBuilds:
  esbuild: true
